<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Kantong: catat pemasukan dan pengeluaran semudah chat. Anggaran, dompet, tagihan rutin, target tabungan, dan laporan bulanan. Gratis, data tersimpan di perangkatmu.">
<meta name="theme-color" content="#2B44B8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kantong">
<meta property="og:title" content="Kantong Keuangan">
<meta property="og:description" content="Catat uang semudah chat: ketik \"kopi 25rb\", selesai.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232B44B8'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='800' font-size='36' text-anchor='middle' fill='white'%3EK%3C/text%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Kantong Keuangan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — sidebar on desktop, bottom tab bar + center "+" on phone; ledger-ink blue accent on cool paper */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F5F7FA; --line:#DCE1EA;
  --fg:#141B2D; --muted:#5D6880; --faint:#8C96AB;
  --accent:#2B44B8; --accent-ink:#FFFFFF; --accent-soft:#E3E8FB;
  --in:#167A47; --in-soft:#DDF2E6; --out:#C03A2B; --out-soft:#FBE4E1;
  --warn:#B86E00; --warn-soft:#FCEFD9;
  --shadow:0 1px 2px rgba(20,27,45,.06),0 8px 24px rgba(20,27,45,.06);
  --scrim:rgba(14,19,33,.45);
  --f-display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1220; --surface:#171C2D; --surface-2:#1E2437; --line:#2A3148;
  --fg:#E8ECF6; --muted:#A1AAC2; --faint:#717B96;
  --accent:#8EA2FF; --accent-ink:#0E1220; --accent-soft:#232C52;
  --in:#5CCB8C; --in-soft:#183526; --out:#FF8A7A; --out-soft:#3A1F1E;
  --warn:#F2B04C; --warn-soft:#3A2C14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1220; --surface:#171C2D; --surface-2:#1E2437; --line:#2A3148;
  --fg:#E8ECF6; --muted:#A1AAC2; --faint:#717B96;
  --accent:#8EA2FF; --accent-ink:#0E1220; --accent-soft:#232C52;
  --in:#5CCB8C; --in-soft:#183526; --out:#FF8A7A; --out-soft:#3A1F1E;
  --warn:#F2B04C; --warn-soft:#3A2C14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}

.app{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
.main{padding-inline:16px;padding-block:16px 120px;max-width:1080px;width:100%;margin:0 auto;min-width:0}
@media (min-width:900px){
  .app{grid-template-columns:232px 1fr}
  .side{display:flex;flex-direction:column;gap:4px;padding:24px 14px;border-right:1px solid var(--line);background:var(--surface);position:sticky;top:0;height:100vh}
  .main{padding-inline:32px;padding-block:28px 48px}
  .tabbar{display:none!important}
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-family:var(--f-display);font-weight:800;font-size:20px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:16px;font-weight:800}
.navbtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:0;background:none;text-align:left;color:var(--muted);font-weight:600}
.navbtn:hover{background:var(--surface-2);color:var(--fg)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.navbtn svg{width:19px;height:19px;flex:none}
.side .add-big{margin-top:10px;justify-content:center;background:var(--accent);color:var(--accent-ink)}
.side .add-big:hover{background:var(--accent);color:var(--accent-ink);filter:brightness(1.08)}
.side .foot{margin-top:auto;font-size:12px;color:var(--faint);padding:8px 12px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--faint);padding:6px 0}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.fab{justify-self:center;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(43,68,184,.35);margin-top:-22px}
.fab svg{width:26px;height:26px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:26px;font-weight:800}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.back{border:0;background:var(--surface);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;box-shadow:var(--shadow)}
.back svg{width:18px;height:18px}

.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:760px){.grid.two{grid-template-columns:1.25fr 1fr}.grid.half{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h2{font-size:16px;font-weight:700}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:4px 0}

.hero{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(255,255,255,.08)}
.hero .lbl{font-size:13px;opacity:.85;font-weight:600}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,8vw,44px);letter-spacing:-.02em;line-height:1.1;margin:4px 0 14px}
.hero-wallets{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.wchip{background:rgba(255,255,255,.14);border-radius:10px;padding:7px 10px;font-size:12px;min-width:0}
.wchip b{display:block;font-size:14px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface-2);border-radius:var(--r-sm);padding:12px;min-width:0}
.stat .k{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:clamp(15px,3.6vw,20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .d{font-size:11.5px;color:var(--muted);margin-top:2px}
.c-in{color:var(--in)} .c-out{color:var(--out)} .c-warn{color:var(--warn)}

.bars{display:flex;align-items:flex-end;gap:2px;height:120px;position:relative;border-bottom:1px solid var(--line)}
.bars .b{flex:1;background:var(--accent);opacity:.85;border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars .b.zero{background:var(--line);opacity:1}
.bars .b.today{background:var(--out);opacity:1}
.bars .b.future{background:transparent;border:1px dashed var(--line);border-bottom:0}
.bars .avg{position:absolute;left:0;right:0;border-top:1.5px dashed var(--warn);pointer-events:none}
.bars .avg span{position:absolute;right:0;top:-18px;font-size:11px;color:var(--warn);font-weight:600;background:var(--surface);padding:0 4px}
.bar-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:4px}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 6px;border-radius:10px;border:0;background:none;width:100%;text-align:left}
button.row:hover{background:var(--surface-2)}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none}
.row .mid{flex:1;min-width:0}
.row .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:700;white-space:nowrap}
.dayhead{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--muted);padding:14px 6px 4px;border-bottom:1px solid var(--line);margin-bottom:4px}

.prog{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:var(--in)}
.prog i.warn{background:var(--warn)} .prog i.over{background:var(--out)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--in-soft);color:var(--in)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.over{background:var(--out-soft);color:var(--out)} .pill.muted{background:var(--surface-2);color:var(--muted)}

.monthnav{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:12px;padding:4px;box-shadow:var(--shadow)}
.monthnav button{border:0;background:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.monthnav button:hover{background:var(--surface-2)}
.monthnav button svg{width:16px;height:16px}
.monthnav span{font-weight:700;min-width:118px;text-align:center;font-size:14px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:0 12px;box-shadow:var(--shadow);min-width:0}
.search svg{width:17px;height:17px;color:var(--faint);flex:none}
.search input{border:0;background:none;padding:11px 0;width:100%;outline:none;min-width:0}
.sel{background:var(--surface);border:0;border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);max-width:100%}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 10px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.seg.type button[aria-pressed="true"][data-v="out"]{color:var(--out)}
.seg.type button[aria-pressed="true"][data-v="in"]{color:var(--in)}
.seg.type button[aria-pressed="true"][data-v="transfer"]{color:var(--accent)}

.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--surface-2);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--out-soft);color:var(--out)}
.btn.ghost{background:none;color:var(--accent);padding-inline:8px}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty h3{color:var(--fg);font-size:18px;margin-bottom:6px}
.welcome{display:grid;gap:14px;align-items:center}
@media(min-width:700px){.welcome{grid-template-columns:1.3fr 1fr}}
.welcome ol{margin:8px 0 0;padding-left:20px;color:var(--muted)}
.welcome ol li{margin:4px 0}
.welcome .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
kbd{font-family:var(--f-body);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px}

.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-weight:600;font-size:13.5px}

.donut-wrap{display:grid;gap:16px;align-items:center}
@media(min-width:560px){.donut-wrap{grid-template-columns:200px 1fr}}
.donut{position:relative;width:200px;max-width:100%;aspect-ratio:1;margin:0 auto}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .ctr b{font-family:var(--f-display);font-size:20px}
.donut .ctr small{color:var(--muted);font-size:12px}
.legend .row{padding:7px 4px}
.dot{width:10px;height:10px;border-radius:3px;flex:none}

.mbars{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px;border-bottom:1px solid var(--line)}
.mbars .g{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px;height:100%;min-width:0}
.mbars .g i{width:40%;max-width:22px;border-radius:4px 4px 0 0;min-height:2px}
.mbars .g i.in{background:var(--in)} .mbars .g i.out{background:var(--out)}
.mlabels{display:flex;gap:10px;font-size:11.5px;color:var(--muted);margin-top:6px}
.mlabels span{flex:1;text-align:center}
.mlabels span.cur{color:var(--fg);font-weight:700}
.keys{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
.keys span{display:inline-flex;align-items:center;gap:6px}

.insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

.menu{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:600px){.menu{grid-template-columns:1fr 1fr}}
.menu .row{background:var(--surface);box-shadow:var(--shadow);padding:14px}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .2s ease}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px;max-height:88%}}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.scrim,.sheet{animation:none}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-h h2{font-size:19px}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.x svg{width:16px;height:16px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.flabel{font-size:12.5px;font-weight:700;color:var(--muted)}
.inp{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;width:100%;outline:none;min-width:0}
.inp:focus{border-color:var(--accent)}
.smart{background:var(--accent-soft);border-radius:14px;padding:10px 12px;margin-bottom:14px}
.smart input{border:0;background:none;outline:none;width:100%;font-weight:600;padding:4px 0}
.smart .hint{font-size:12px;color:var(--muted);min-height:18px}
.smart .hint b{color:var(--accent)}
.smart-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.scanbtn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:99px;padding:5px 12px;font-weight:700;font-size:12.5px}
.scanbtn svg{width:16px;height:16px}
.scanbtn:disabled{opacity:.6;cursor:progress}
.scanbar{display:block;height:4px;border-radius:99px;background:var(--surface);margin-top:6px;overflow:hidden}
.scanbar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.scanres{border:1.5px dashed var(--accent);border-radius:14px;padding:12px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
.scanres details summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent)}
.scanitems{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px;max-height:180px;overflow:auto}
.scanitems li{display:flex;justify-content:space-between;gap:10px}
.scanitems li span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srows{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 120px 32px;gap:6px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.srow .inp{padding:7px 9px;font-size:13px;border-radius:9px}
.srow select.inp{grid-column:1 / 3}
.samt{display:flex;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:9px;padding:0 8px;background:var(--surface)}
.samt:focus-within{border-color:var(--accent)}
.samt span{font-size:12px;color:var(--muted);font-weight:700}
.samt input{border:0;outline:none;background:none;width:100%;min-width:0;padding:7px 0;font-size:13px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.srow .x{width:32px;height:32px}
.ssum{font-size:12.5px;color:var(--muted)}
.stotal{border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;margin-top:10px;border:1.5px solid transparent;transition:background .2s,border-color .2s,color .2s}
.stotal .lbl{font-size:12.5px;font-weight:600}
.stotal .val{font-family:var(--f-display);font-weight:800;font-size:20px;text-align:right;font-variant-numeric:tabular-nums}
.stotal .sub{font-size:12px;opacity:.85}
.stotal .subv{font-size:12px;text-align:right;font-variant-numeric:tabular-nums;opacity:.85}
.stotal .msg{grid-column:1 / -1;font-size:12.5px;font-weight:700;margin-top:4px}
.stotal.ok{background:var(--in-soft);border-color:var(--in);color:var(--in)}
.stotal.bad{background:var(--out-soft);border-color:var(--out);color:var(--out)}
.stotal.na{background:var(--surface-2);color:var(--muted)}
.ssum.warn{color:var(--warn)}
.amount{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);padding:4px 2px 6px}
.amount:focus-within{border-color:var(--accent)}
.amount span{font-family:var(--f-display);font-size:22px;font-weight:700;color:var(--muted)}
.amount input{border:0;outline:none;background:none;font-family:var(--f-display);font-weight:800;font-size:34px;width:100%;min-width:0;letter-spacing:-.02em}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:600}
.quick button:hover{border-color:var(--accent);color:var(--accent)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;line-height:1.2;text-align:center;min-width:0}
.chip .e{font-size:20px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chips.row-chips{display:flex;flex-wrap:wrap}

(() => {
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const uid = (p = "") => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const NF = new Intl.NumberFormat("id-ID");
const rp = n => (n < 0 ? "−" : "") + "Rp" + NF.format(Math.round(Math.abs(n || 0)));
const rpShort = n => {
  const a = Math.abs(n || 0); let s;
  if (a >= 1e9) s = (a / 1e9).toFixed(1).replace(/\.0$/, "") + " M";
  else if (a >= 1e6) s = (a / 1e6).toFixed(1).replace(/\.0$/, "") + " jt";
  else if (a >= 1e3) s = Math.round(a / 1e3) + " rb";
  else s = String(Math.round(a));
  return (n < 0 ? "−" : "") + "Rp" + s.replace(".", ",");
};
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => iso(new Date());
const mKey = s => s.slice(0, 7);
const curMonth = () => todayISO().slice(0, 7);
const MONTHS = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const MSHORT = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const DAYS = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const monthLabel = k => { const [y, m] = k.split("-").map(Number); return `${MONTHS[m - 1]} ${y}`; };
const shiftMonth = (k, d) => { let [y, m] = k.split("-").map(Number); m += d; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return `${y}-${pad(m)}`; };
const daysIn = k => { const [y, m] = k.split("-").map(Number); return new Date(y, m, 0).getDate(); };
const parseD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const dayLabel = s => {
  const t = todayISO(), y = iso(new Date(Date.now() - 864e5));
  if (s === t) return "Hari ini"; if (s === y) return "Kemarin";
  const d = parseD(s); return `${DAYS[d.getDay()]}, ${d.getDate()} ${MSHORT[d.getMonth()]}`;
};
/* "25rb" "1,5jt" "25.000" "25k" -> number */
function parseAmount(raw) {
  if (raw == null) return 0;
  let s = String(raw).toLowerCase().replace(/rp\.?/g, "").replace(/\s+/g, "");
  const m = s.match(/^([\d.,]+)(rb|ribu|k|jt|juta|m|miliar)?$/);
  if (!m) return 0;
  let n = m[1], suf = m[2];
  if (suf) { n = n.replace(/\./g, ",").replace(",", ".").replace(/,/g, ""); }
  else { n = n.replace(/\./g, "").replace(",", "."); } // titik = pemisah ribuan (Rupiah)
  let v = parseFloat(n) || 0;
  if (suf === "rb" || suf === "ribu" || suf === "k") v *= 1e3;
  else if (suf === "jt" || suf === "juta") v *= 1e6;
  else if (suf === "m" || suf === "miliar") v *= 1e9;
  return Math.round(v);
}

};
const PALETTE = ["#E4572E","#2B44B8","#17A398","#F3A712","#8E44AD","#D81E5B","#4C9F38","#3A86FF","#FF7F50","#6D597A","#2EC4B6","#B5651D","#5F6CAF","#9AAE1B","#E07A5F","#468FAF"];

}
function defaultState() {

    v: 1,
    wallets: [
      { id: "w-cash", name: "Tunai", e: "💵", initial: 0 },
      { id: "w-bank", name: "Rekening Bank", e: "🏦", initial: 0 },

function normalize(st) {
  const d = defaultState();
  st = Object.assign(d, st || {});
  for (const k of ["wallets", "categories", "recurring", "goals"]) if (!Array.isArray(st[k])) st[k] = [];

/* ---------- demo ---------- */
function makeDemo() {
  const st = defaultState();
  st.wallets[0].initial = 650000; st.wallets[1].initial = 14200000; st.wallets[2].initial = 350000;
  st.budgets = { "c-food": 2500000, "c-transport": 900000, "c-groceries": 2200000, "c-bills": 1300000, "c-baby": 1800000, "c-fun": 600000, "c-shop": 700000 };
  const cm = curMonth(), td = new Date().getDate();
  st.recurring = [
    { id: "r1", name: "Internet rumah", amount: 385000, type: "out", cat: "c-bills", wallet: "w-bank", day: 5, lastPaid: cm },
    { id: "r2", name: "Token listrik", amount: 500000, type: "out", cat: "c-bills", wallet: "w-ewallet", day: Math.min(28, td + 3), lastPaid: "" },
    { id: "r3", name: "Gaji bulanan", amount: 16500000, type: "in", cat: "c-salary", wallet: "w-bank", day: 25, lastPaid: td >= 25 ? cm : "" },

    { id: "g3", name: "Sepatu race baru", e: "👟", target: 2400000, saved: 2400000, deadline: "" },

  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const pick = a => a[Math.floor(rnd() * a.length)];
  const r = (a, b, step = 1000) => Math.round((a + rnd() * (b - a)) / step) * step;
  const months = {}; const t0 = todayISO();
  const add = (date, type, amount, cat, wallet, note, to) => {
    if (date > t0) return; const k = mKey(date); (months[k] ||= { tx: {} });

    if (back === 1) add(`${k}-12`, "in", 3500000, "c-freelance", "w-bank", "Proyek desain landing page");

    add(`${k}-02`, "out", 2750000, "c-home", "w-bank", "Sewa kontrakan");
    add(`${k}-03`, "transfer", 1500000, "", "w-bank", "Isi saldo e-wallet", "w-ewallet");
    add(`${k}-01`, "transfer", 1000000, "", "w-bank", "Tarik tunai", "w-cash");
    for (let d = 1; d <= n; d++) {
      const date = `${k}-${pad(d)}`; const dow = parseD(date).getDay();
      if (rnd() < .85) add(date, "out", r(18000, 45000), "c-food", pick(["w-cash", "w-ewallet"]), pick(["Kopi susu", "Makan siang", "Nasi padang", "Sarapan bubur", "GoFood makan malam", "Bakso"]));
      if (rnd() < .35) add(date, "out", r(15000, 60000), "c-food", "w-ewallet", pick(["Kopi sore", "Boba", "Jajan"]));
      if (dow >= 1 && dow <= 5 && rnd() < .7) add(date, "out", r(14000, 38000), "c-transport", "w-ewallet", pick(["Gojek ke kantor", "Grab pulang", "KRL", "Parkir"]));
      if (dow === 6) add(date, "out", r(320000, 640000, 500), "c-groceries", "w-bank", pick(["Belanja mingguan", "Supermarket", "Sayur & buah"]));
      if (rnd() < .12) add(date, "out", r(90000, 260000), "c-baby", pick(["w-bank", "w-ewallet"]), pick(["Popok & tisu basah", "Susu formula", "Perlengkapan bayi"]));
      if (dow === 0 && rnd() < .5) add(date, "out", r(80000, 220000), "c-fun", "w-bank", pick(["Nonton bioskop", "Makan keluarga", "Jalan ke mall"]));

/* ---------- store ---------- */
const S = { state: null, months: {}, mode: "loading", demo: false, saving: 0 };

const LS_KEY = "kantong.data.v1";
const CFG = window.KANTONG_CONFIG || {};
const SUPA_ON = !!(CFG.supabaseUrl && CFG.supabaseAnonKey);
let sb = null, me = null, downloads = null;
let chain = Promise.resolve();
S.synced = {}; S.syncedMonth = {};

function loadLocal() {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) { const d = JSON.parse(raw); return { state: normalize(d.state), months: d.months || {} }; } } catch (e) {}
  return null;
}
function saveLocal() { if (S.demo || S.mode !== "local") return; try { localStorage.setItem(LS_KEY, JSON.stringify({ state: S.state, months: S.months })); } catch (e) { toast("Penyimpanan browser penuh atau diblokir."); } }
const ok = r => { if (r && r.error) throw r.error; return r; };
function persist(fn) {
  if (S.demo) return;
  S.saving++; renderStatus();
  chain = chain.then(() => S.mode === "supa" ? fn() : saveLocal())
    .catch(e => toast("Gagal menyimpan ke akun. Periksa koneksi internet, lalu coba lagi. (" + (e && (e.message || e.code) || "galat") + ")"))
    .finally(() => { S.saving--; renderStatus(); });
}
function saveState() {
  if (S.demo) return;
  if (S.mode === "supa") { const snap = clone(S.state); persist(() => sb.from("user_state").upsert({ user_id: me.id, data: snap, updated_at: new Date().toISOString() }).then(ok)); }
  else saveLocal();
}
function saveMonth(k) {
  if (S.demo) return;
  if (S.mode === "supa") persist(() => syncMonth(k)); else saveLocal();
}

/* Supabase rows <-> transactions */
const toRow = t => ({ user_id: me.id, id: t.id, type: t.type, amount: Math.round(t.amount), cat: t.cat || null, wallet: t.wallet, to_wallet: t.to || null, date: t.date, note: t.note || "", at: t.at || 0, updated_at: new Date().toISOString() });
const fromRow = r => ({ id: r.id, type: r.type, amount: Number(r.amount), cat: r.cat || "", wallet: r.wallet, to: r.to_wallet || "", date: r.date, note: r.note || "", at: Number(r.at) || 0 });
async function syncMonth(k) {
  const cur = (S.months[k] || {}).tx || {}; const ups = [], dels = [];
  for (const id in cur) if (S.synced[id] !== JSON.stringify(cur[id])) ups.push(clone(cur[id]));
  for (const id in S.syncedMonth) if (S.syncedMonth[id] === k && !cur[id]) dels.push(id);
  for (let i = 0; i < ups.length; i += 500) {
    const part = ups.slice(i, i + 500);
    ok(await sb.from("transactions").upsert(part.map(toRow), { onConflict: "user_id,id" }));
    part.forEach(t => { S.synced[t.id] = JSON.stringify(t); S.syncedMonth[t.id] = k; });
  }
  for (let i = 0; i < dels.length; i += 200) {
    const part = dels.slice(i, i + 200);
    ok(await sb.from("transactions").delete().eq("user_id", me.id).in("id", part));
    part.forEach(id => { delete S.synced[id]; delete S.syncedMonth[id]; });
  }
}
async function fetchCloud() {
  const st = ok(await sb.from("user_state").select("data").eq("user_id", me.id).maybeSingle()).data;
  let rows = [];
  for (let from = 0; ; from += 1000) {
    const data = ok(await sb.from("transactions").select("id,type,amount,cat,wallet,to_wallet,date,note,at").order("date", { ascending: true }).order("id", { ascending: true }).range(from, from + 999)).data || [];

    if (f.type !== "all" && t.type !== f.type) return false;
    if (f.cat && t.cat !== f.cat) return false;
    if (f.wallet && t.wallet !== f.wallet && t.to !== f.wallet) return false;
    if (q) { const hay = `${t.note} ${catById(t.cat).name} ${walById(t.wallet).name}`.toLowerCase(); if (!hay.includes(q) && !(qn && t.amount === qn)) return false; }
    return true;
  });
  let inc = 0, out = 0; list.forEach(t => { if (t.type === "in") inc += t.amount; else if (t.type === "out") out += t.amount; });
  if (!list.length) { el.innerHTML = `<div class="empty"><h3>Tidak ada transaksi</h3>${monthTx(UI.month).length ? "Coba ubah pencarian atau filter." : `Belum ada catatan di ${monthLabel(UI.month)}.`}</div>`; return; }
  const groups = {}; list.forEach(t => (groups[t.date] ||= []).push(t));
  el.innerHTML = `<div class="stats" style="margin-bottom:6px"><div class="stat"><div class="k">${list.length} transaksi</div><div class="v num">${rpShort(inc - out)}</div></div><div class="stat"><div class="k">Masuk</div><div class="v c-in num">${rpShort(inc)}</div></div><div class="stat"><div class="k">Keluar</div><div class="v c-out num">${rpShort(out)}</div></div></div>` +
    Object.keys(groups).sort().reverse().map(d => {
      const net = groups[d].reduce((a, t) => a + (t.type === "in" ? t.amount : t.type === "out" ? -t.amount : 0), 0);
      return `<div class="dayhead"><span>${dayLabel(d)}</span><span class="num">${net ? rp(net) : ""}</span></div><div class="list">${groups[d].map(txRow).join("")}</div>`;
    }).join("");
}

/* transaction sheet */
function guessCategory(text, type) {
  const s = " " + text.toLowerCase() + " "; let best = null, bestLen = 0;
  for (const c of cats()) {
    if (type && type !== "transfer" && c.type !== type) continue;
    for (const kw of (c.kw || "").split(",").map(x => x.trim()).filter(Boolean)) {
      if (s.includes(kw) && kw.length > bestLen) { best = c; bestLen = kw.length; }
    }
    if (s.includes(c.name.toLowerCase()) && c.name.length > bestLen) { best = c; bestLen = c.name.length; }
  }
  return best;
}
function parseSmart(text) {
  const toks = text.trim().split(/\s+/); let amount = 0; const rest = [];
  for (const t of toks) { const v = /\d/.test(t) ? parseAmount(t) : 0; if (v && !amount) amount = v; else rest.push(t); }
  return { amount, note: rest.join(" ") };
}
function txSheet(existing, preset = {}, opts = {}) {
  const st = S.state;
  let scanRes = null, scanBusy = false;
  const t = existing ? clone(existing) : Object.assign({ id: uid("t"), type: "out", amount: 0, cat: "", wallet: "", to: "", date: todayISO(), note: "" }, preset);
  if (!t.wallet) t.wallet = st.last?.[t.type] && st.wallets.some(w => w.id === st.last[t.type]) ? st.last[t.type] : st.wallets[0]?.id;
  if (t.type === "transfer" && !t.to) t.to = st.wallets.find(w => w.id !== t.wallet)?.id || "";
  const prevMonth = existing ? mKey(existing.date) : null;
  if (!st.wallets.length) { toast("Tambahkan dompet dulu."); UI.view = "wallets"; render(); return; }

  let scanOpen = false;
  const itemsSum = () => (scanRes ? scanRes.items.reduce((a, i) => a + (i.amount || 0), 0) : 0);
  const scanSumHTML = () => {
    const r = scanRes, sum = itemsSum(), n = r.items.filter(i => i.amount > 0).length;
    if (!r.total) return { cls: "", html: `${n} barang · jumlah <b class="num">${rp(sum)}</b>` };
    const diff = r.total - sum;
    if (diff > 0) return { cls: "", html: `Jumlah barang <b class="num">${rp(sum)}</b> dari total ${rp(r.total)}. Selisih ${rp(diff)} dicatat sebagai "Pajak & biaya lain".` };
    if (diff < 0) return { cls: "warn", html: `Jumlah barang <b class="num">${rp(sum)}</b> lebih besar ${rp(-diff)} dari total struk ${rp(r.total)}. Periksa harga atau hapus baris yang salah baca.` };
    return { cls: "", html: `Jumlah barang <b class="num">${rp(sum)}</b> sama dengan total struk.` };
  };
  const scanTotalBox = () => {
    const r = scanRes, sum = itemsSum();
    if (!r.total) return { cls: "na", html: `<span class="lbl">Total barang</span><span class="val">${rp(sum)}</span><span class="msg">Total struk belum diisi. Isi di kolom Jumlah di bawah untuk mencocokkan.</span>` };
    const diff = r.total - sum, same = diff === 0;
    return { cls: same ? "ok" : "bad", html: `<span class="lbl">Total barang</span><span class="val">${rp(sum)}</span><span class="sub">Total struk</span><span class="subv">${rp(r.total)}</span><span class="msg">${same ? "✓ Sudah sama dengan total struk" : diff > 0 ? `Belum sama: kurang ${rp(diff)}` : `Belum sama: lebih ${rp(-diff)}`}</span>` };
  };
  const updateScanSum = el => {
    if (!scanRes) return;
    const ss = scanSumHTML(), sumEl = q("#scanSum", el); if (sumEl) { sumEl.className = "ssum " + ss.cls; sumEl.innerHTML = ss.html; }
    const tb = scanTotalBox(), tEl = q("#scanTotal", el); if (tEl) { tEl.className = "stotal " + tb.cls; tEl.innerHTML = tb.html; }
  };
  const scanPanel = () => {
    if (!scanRes) return "";
    const r = scanRes, outCats = cats().filter(c => c.type === "out"), ss = scanSumHTML();
    const n = r.items.filter(i => i.amount > 0).length;

function simpleForm(title, fields, { onSave, onDelete, deleteMsg, saveLabel = "Simpan" }) {

    el.querySelectorAll("[data-money]").forEach(i => i.addEventListener("input", () => { if (/^[\d.]*$/.test(i.value)) { const v = parseAmount(i.value); i.value = v ? NF.format(v) : ""; } }));

function payRecurring(id) {

  const cm = curMonth(); const d = `${cm}-${pad(Math.min(r.day, daysIn(cm)))}`;
  const date = d > todayISO() ? todayISO() : d;
  const t = { id: uid("t"), type: r.type, amount: r.amount, cat: r.cat, wallet: r.wallet, to: "", date, note: r.name, at: Date.now() };
  (S.months[mKey(date)] ||= { tx: {} }).tx[t.id] = t; saveMonth(mKey(date));
  r.lastPaid = cm; saveState(); render();
  toastUndo(`${r.name} ${rp(r.amount)} dicatat`, () => { delete S.months[mKey(date)].tx[t.id]; saveMonth(mKey(date)); r.lastPaid = ""; saveState(); render(); });
}
function goalSheet(id) {
  const g = S.state.goals.find(x => x.id === id);
  simpleForm(g ? "Ubah target" : "Target baru", [
    { k: "name", l: "Nama target", v: g?.name || "", ph: "cth: Dana darurat" },
    { k: "e", l: "Ikon (emoji)", v: g?.e || "🎯" },
    { k: "target", l: "Jumlah target", type: "money", v: g?.target || 0 },
    { k: "saved", l: "Sudah terkumpul", type: "money", v: g?.saved || 0 },
    { k: "deadline", l: "Tenggat (opsional)", type: "date", v: g?.deadline || "" },
  ], {
    onSave: v => { if (!v.name || !v.target) { toast("Isi nama dan jumlah target."); return false; } if (g) Object.assign(g, v); else S.state.goals.push({ id: uid("g"), ...v }); saveState(); toast("Target disimpan"); },
    onDelete: g ? () => { S.state.goals = S.state.goals.filter(x => x.id !== id); saveState(); } : null,
  });
}
function goalAddSheet(id) {
  const g = S.state.goals.find(x => x.id === id); if (!g) return;
  simpleForm(`Tambah dana: ${g.name}`, [{ k: "amt", l: "Jumlah", type: "money", v: 0, help: `Terkumpul ${rp(g.saved)} dari ${rp(g.target)}. Isi angka negatif tidak didukung; untuk mengurangi, pakai Ubah.` }], {
    saveLabel: "Tambahkan",
    onSave: v => { if (!v.amt) { toast("Isi jumlahnya."); return false; } g.saved = (g.saved || 0) + v.amt; saveState(); toast(g.saved >= g.target ? `Selamat, target ${g.name} tercapai!` : `${rp(v.amt)} ditambahkan`); },
  });
}
function catSheet(id, type) {
  const c = cats().find(x => x.id === id);
  const used = id && allTx().some(t => t.cat === id);
  simpleForm(c ? "Ubah kategori" : "Kategori baru", [
    { k: "name", l: "Nama", v: c?.name || "" },
    { k: "e", l: "Ikon (emoji)", v: c?.e || "🏷️" },
    { k: "kw", l: "Kata kunci", v: c?.kw || "", ph: "pisahkan dengan koma", help: "Saat kamu mengetik kata ini di Ketik cepat, kategori ini dipilih otomatis." },
  ], {
    onSave: v => { if (!v.name) { toast("Nama kategori wajib diisi."); return false; } v.kw = v.kw.toLowerCase(); if (c) Object.assign(c, v); else S.state.categories.push({ id: uid("c"), type: type || "out", col: S.state.categories.length, ...v }); saveState(); toast("Kategori disimpan"); },
    onDelete: c ? () => { if (used) { toast("Kategori masih dipakai transaksi, jadi tidak bisa dihapus."); return; } S.state.categories = S.state.categories.filter(x => x.id !== id); delete S.state.budgets[id]; saveState(); } : null,
    deleteMsg: used ? "Kategori ini masih dipakai transaksi dan tidak bisa dihapus." : "Hapus kategori ini?",
  });
}

/* ---------- data export / import ---------- */
async function offerFile(filename, data, mime) {
  if (!window.claude) {
    try {
      const url = URL.createObjectURL(new Blob([data], { type: filename.endsWith(".csv") ? "text/csv;charset=utf-8" : "application/json" }));
      const link = document.createElement("a"); link.href = url; link.download = filename; document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000); toast("File diunduh"); return;
    } catch (e) {}
  }
  if (downloads) {
    try { await downloads.save({ filename, data }); toast("File siap disimpan"); return; }
    catch (e) { if (e && e.code === "declined") return; }
  }
  openSheet("Salin data", `<p class="muted small">Unduhan otomatis tidak tersedia di browser ini. Salin isi berikut lalu tempel ke file <b>${esc(filename)}</b>.</p><textarea class="inp" id="dump" rows="10" style="font-family:monospace;font-size:12px" readonly>${esc(data)}</textarea><div class="actions"><button class="btn primary" id="cp">Salin</button></div>`, el => {
    $("#cp", el).onclick = () => { const ta = $("#dump", el); navigator.clipboard?.writeText(ta.value).then(() => toast("Disalin"), () => { ta.select(); toast("Tekan Ctrl/Cmd+C untuk menyalin"); }) ?? (ta.select(), toast("Tekan Ctrl/Cmd+C untuk menyalin")); };
  });
}
function exportCSV() {
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const rows = [["Tanggal", "Jenis", "Kategori", "Dompet", "Ke dompet", "Jumlah", "Catatan"]];
  allTx().slice().reverse().forEach(t => rows.push([t.date, t.type === "in" ? "Pemasukan" : t.type === "out" ? "Pengeluaran" : "Transfer", t.type === "transfer" ? "" : catById(t.cat).name, walById(t.wallet).name, t.to ? walById(t.to).name : "", t.type === "out" ? -t.amount : t.amount, t.note]));
  offerFile(`kantong-transaksi-${todayISO()}.csv`, "﻿" + rows.map(r => r.map(q).join(",")).join("\r\n"));
}
function exportBackup() { offerFile(`kantong-cadangan-${todayISO()}.json`, JSON.stringify({ app: "kantong", v: 1, exportedAt: new Date().toISOString(), state: S.state, months: S.months }, null, 1)); }
function importBackup(file) {
  const fr = new FileReader();
  fr.onload = () => {
    let d; try { d = JSON.parse(fr.result); } catch (e) { toast("File tidak bisa dibaca. Pastikan itu file cadangan Kantong (.json)."); return; }
    if (!d || !d.state || !d.months) { toast("Ini bukan file cadangan Kantong."); return; }
    const n = Object.values(d.months).reduce((a, m) => a + Object.keys(m.tx || {}).length, 0);
    openSheet("Pulihkan cadangan", `<p>File berisi <b>${n} transaksi</b>. Data yang ada sekarang akan diganti.</p><div class="actions"><button class="btn" data-close2>Batal</button><button class="btn primary" id="doImp">Ganti dengan cadangan</button></div>`, el => {
      el.querySelector("[data-close2]").onclick = () => sheetClose();
      $("#doImp", el).onclick = () => {
        S.demo = false; const old = Object.keys(S.months);
        S.state = normalize(d.state); S.months = d.months;
        saveState(); if (S.mode === "supa") { new Set([...old, ...Object.keys(S.months)]).forEach(k => saveMonth(k)); } else saveLocal();
        sheetClose(); render(); toast("Cadangan dipulihkan");
      };
    });
  };
  fr.readAsText(file);
}
function wipeAll() {
  openSheet("Hapus semua data", `<p>Semua transaksi, dompet, anggaran, tagihan rutin, dan target akan dihapus. Ini tidak bisa dibatalkan.</p><p class="small muted">Saran: unduh cadangan dulu.</p><div class="actions"><button class="btn" data-close3>Batal</button><button class="btn danger" id="doWipe">Ya, hapus semua</button></div>`, el => {
    el.querySelector("[data-close3]").onclick = () => sheetClose();
    $("#doWipe", el).onclick = () => { const old = Object.keys(S.months); S.months = {}; S.state = defaultState(); saveState(); if (S.mode === "supa") old.forEach(k => saveMonth(k)); else saveLocal(); sheetClose(); UI.view = "home"; render(); toast("Semua data dihapus"); };
  });
}

/* ---------- toast ---------- */
let toastT;
function toast(msg) { clearTimeout(toastT); $("#toastRoot").innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; toastT = setTimeout(() => $("#toastRoot").innerHTML = "", 2600); }
function toastUndo(msg, undo) {
  clearTimeout(toastT); $("#toastRoot").innerHTML = `<div class="toast" role="status">${esc(msg)}<button id="undo">Urungkan</button></div>`;
  $("#undo").onclick = () => { undo(); $("#toastRoot").innerHTML = ""; toast("Dibatalkan"); };
  toastT = setTimeout(() => $("#toastRoot").innerHTML = "", 5000);
}

/* ---------- events ---------- */
function go(v) { UI.view = v; try { localStorage.setItem("kantong.view", v); } catch (e) {} render(); window.scrollTo(0, 0); }
document.addEventListener("click", e => {
  const b = e.target.closest("[data-go],[data-act],[data-edit],[data-pay],[data-budget],[data-wallet],[data-rec],[data-goal],[data-gadd],[data-cat],[data-ftype],[data-catfilter]");
  if (!b || b.closest("#sheetRoot")) return;
  const d = b.dataset;
  if (d.go) return go(d.go);
  if (d.edit != null) { const t = S.months[d.m]?.tx[d.edit]; if (t) txSheet(t); return; }
  if (d.pay) return payRecurring(d.pay);
  if (d.budget != null) return budgetSheet(d.budget);
  if (d.wallet != null) return walletSheet(d.wallet);
  if (d.rec != null) return recSheet(d.rec);
  if (d.goal != null) return goalSheet(d.goal);
  if (d.gadd) return goalAddSheet(d.gadd);
  if (d.cat != null) return catSheet(d.cat, d.ctype);
  if (d.ftype) { UI.f.type = d.ftype; document.querySelectorAll("[data-ftype]").forEach(x => x.setAttribute("aria-pressed", x === b)); return renderHistoryList(); }
  if (d.catfilter) { UI.f = { q: "", type: "out", cat: d.catfilter, wallet: "" }; return go("history"); }
  switch (d.act) {
    case "add": return txSheet(null);
    case "scan": return txSheet(null, {}, { scan: true });
    case "transfer": return txSheet(null, { type: "transfer" });
    case "mPrev": UI.month = shiftMonth(UI.month, -1); return render();
    case "mNext": UI.month = shiftMonth(UI.month, 1); return render();
    case "demo": { const dm = makeDemo(); S.demo = true; S.state = dm.state; S.months = dm.months; render(); toast("Data contoh dimuat"); return; }
    case "exitDemo": { S.demo = false; if (S.mode === "supa") { enterCloud({ user: me }); } else { const l = loadLocal(); S.state = l ? l.state : defaultState(); S.months = l ? l.months : {}; render(); } return; }
    case "signin": return signIn();
    case "signout": return signOut();
    case "merge": { const l = loadLocal(); if (l) { mergeLocal(l, false); render(); toast("Catatan browser dipindahkan ke akunmu"); } else { S.pendingLocal = 0; render(); } return; }
    case "mergeSkip": S.pendingLocal = 0; return render();
    case "csv": return exportCSV();
    case "backup": return exportBackup();
    case "wipe": return wipeAll();
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { UI.f.q = e.target.value; renderHistoryList(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "fCat") { UI.f.cat = e.target.value; renderHistoryList(); }
  if (e.target.id === "fWal") { UI.f.wallet = e.target.value; renderHistoryList(); }
  if (e.target.id === "importFile" && e.target.files[0]) { importBackup(e.target.files[0]); e.target.value = ""; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && sheetClose) { sheetClose(); return; }
  if (sheetClose || !S.state) return;
  const tag = (e.target.tagName || "").toLowerCase(); if (["input", "textarea", "select"].includes(tag) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "n" || e.key === "N" || e.key === "+") { e.preventDefault(); txSheet(null); }
  if (e.key === "/" && UI.view === "history") { e.preventDefault(); $("#q")?.focus(); }
});

/* boot */
boot();
})();
</script>
